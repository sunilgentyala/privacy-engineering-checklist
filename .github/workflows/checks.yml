name: checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Text style (UTF-8, no em dashes)
        run: python3 scripts/check_text.py
      - name: CHECKLIST.md matches README.md
        run: python3 scripts/sync_checklist.py --check
      - name: Links resolve
        run: python3 scripts/check_links.py
